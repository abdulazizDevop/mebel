{% macro product_grid(cards) %}
<div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
  {% for p, href in cards %}
  <article class="group">
    <a href="{{ href }}">
      <div class="aspect-square mb-3 bg-surface rounded-2xl overflow-hidden">
        <img src="{{ p.main_image }}" alt="{{ p.name }} — {{ site_name }}" loading="lazy" decoding="async" class="w-full h-full object-cover" />
      </div>
      <h3 class="text-base font-bold leading-tight">{{ p.name }}</h3>
      <p class="text-lg font-bold">{{ price(p.price) }} ₽</p>
    </a>
  </article>
  {% endfor %}
</div>
{% endmacro %}
